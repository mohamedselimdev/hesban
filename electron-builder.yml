appId: eg.hesban.app
productName: HESBAN
copyright: Copyright (c) 2026 Mohamed Selim
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# better-sqlite3-multiple-ciphers ships N-API prebuilt binaries; never rebuild from source.
npmRebuild: false
# Native modules cannot run from inside the archive.
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: dir
      arch: x64
  # Signing is not configured: no certificate exists (see docs/code-signing.md). Local unsigned
  # builds only; the signing step is added when a method is chosen.
  signAndEditExecutable: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
